server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des assets texte
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les assets Vite portent un hash dans leur nom : cache long sans revalidation
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routage côté client (react-router) : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être mis en cache, sinon les déploiements
    # continuent de servir les anciens noms d'assets
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
